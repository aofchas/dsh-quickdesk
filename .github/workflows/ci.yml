name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax checks
        run: |
          node --check quickdesk.mjs
          node --check client.js
          node --check compat.mjs
          node --check scripts/selftest.mjs
          node --check scripts/verify-release.mjs
      - name: Test suite (publish gate)
        run: npm test
      - name: Pack contents
        run: npm pack --dry-run
