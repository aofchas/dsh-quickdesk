name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    # The plugin declares os: ["win32"], so installing/verifying it on a Linux
    # runner fails npm ci with EBADPLATFORM. Build the release on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Test suite (publish gate)
        run: npm test
      - name: Verify tag matches package version
        shell: bash
        run: |
          node -e "const v=require('./package.json').version; const tag=process.env.GITHUB_REF_NAME; if (tag !== 'v'+v) { console.error('tag '+tag+' != v'+v); process.exit(1); }"
      - name: Check whether this version is already on npm
        id: published
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "dsh-quickdesk@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Pack
        run: npm pack
      - name: Publish to npm
        if: steps.published.outputs.exists != 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Resolve bilingual release notes
        id: notes
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          FILE="docs/release-notes/$VERSION.md"
          if [ ! -f "$FILE" ]; then
            echo "Missing bilingual release notes: $FILE"
            exit 1
          fi
          echo "path=$FILE" >> "$GITHUB_OUTPUT"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.notes.outputs.path }}
          files: dsh-quickdesk-*.tgz
